<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoS</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/productos.js"></script>
    <script src="./js/function.js"></script>
    <script src="./js/botones.js"></script>
</head>

<body>
    <!-- Imagen en la esquina superior izquierda -->
    <img src="./img/OXXO-Logo.png" class="logo">

    <!-- Imagen en la esquina superior derecha -->
    <img src="./img/cinepolis-logo.png" class="logoR">


    <!-- Titulo principal -->
    <div class="contenido">
        <div>
            <h1 class="titulo">
                SonoTech
            </h1>
            <h2 class="subtitulo">
                ¡No es bueno pero es barato!
            </h2>
        </div>
    </div>

    <!-- Área principal donde se muestran los productos -->
    <div class="contenedor">
        <table id="tableId">

            <tr>
                <th class="tituloCantidad">
                    Cantidad
                </th>
                <th>
                    Producto
                </th>
                <th>
                    Precio
                </th>
                <th>
                    Total
                </th>
            </tr>

            <tbody id="carrito"></tbody>

        </table>
    </div>

    <!-- Único INPUT de todo el sistema -->
    <input type="text" id="codigoProducto" class="cProd" value="" onkeydown="buscarProducto(event)" autofocus>



    <!-- Botones -->
    <div class="btn">

        <input type="button" id="btn1" class="boton">
        <input type="button" id="btn2" class="boton">
        <input type="button" id="btn3" class="boton">
        <input type="button" id="btn4" class="boton">
        <input type="button" id="btn5" class="boton">

        <div class="total">

            <h1 id="total">
                $0.00
            </h1>

        </div>

        <h4>Cambio</h4>
        <h4 id="mostrarCambio">
            $0.00
        </h4>



    </div>

<div id="modalProductos" class="modal">

    <div class="modal-contenido">

        <span id="cerrar">&times;</span>

        <h2>Selecciona una papita</h2>

        <div class="opcionesPapitas">

            <div class="opcionPapita">
                <img src="./img/adobada.png" class="papita" data-nombre="Sabritas" data-precio="18">
                <h3>$18</h3>
            </div>

            <div class="opcionPapita">
                <img src="./img/peanuts.png" class="papita" data-nombre="Doritos" data-precio="20">
                <h3>$20</h3>
            </div>

            <div class="opcionPapita">
                <img src="./img/churrumais.png" class="papita" data-nombre="Ruffles" data-precio="22">
                <h3>$22</h3>
            </div>

        </div>

    </div>

</div>

    <div id="modalCafe" class="modal">

        <div class="modal-contenido">

            <span id="cerrarBtn2">&times;</span>


            <h2>Selecciona una tamaño</h2>

            <div class="opcionesCafe">
                <img src="./img/cafe.png" class="tamanoCafe cafeChico" data-nombre="Café Chico" data-precio="34">
                <h3>$34.00</h3>
                <img src="./img/cafe.png" class="tamanoCafe cafeMediano" data-nombre="Café Mediano" data-precio="54">
                <h3>$54.00</h3>
                <img src="./img/cafe.png" class="tamanoCafe cafeGrande" data-nombre="Café Grande" data-precio="64">
                <h3>$64.00</h3>
            </div>

        </div>

</div>     
<!-- Modal de depósitos -->
<div id="modalDepositos" class="modal">

    <div class="modal-contenido">

        <span id="cerrarDepositos">&times;</span>

        <h2>Depósitos</h2>

     
<label for="tarjeta1">Número de tarjeta</label>
<input
    type="password"
    id="tarjeta1"
    placeholder="Ingresa los 16 dígitos"
    inputmode="numeric"
    maxlength="16"
    autocomplete="off"
>

<label for="tarjeta2">Confirmar número de tarjeta</label>
<input
    type="password"
    id="tarjeta2"
    placeholder="Confirma los 16 dígitos"
    inputmode="numeric"
    maxlength="16"
    autocomplete="off"
>

        >

        <button type="button" id="confirmarDeposito">
            Confirmar
        </button>
        <p id="tarjetaEnmascarada"></p>
        <p id="mensajeDeposito"></p>

    </div>

</div>

<!-- Segundo modal: cantidad del depósito -->
<div id="modalCantidad" class="modal">

    <div class="modal-contenido">

        <span id="cerrarCantidad">&times;</span>

        <h2>Cantidad del depósito</h2>

        <label for="montoDeposito">Monto a depositar</label>
        <input
            type="number"
            id="montoDeposito"
            placeholder="$0.00"
            min="0.01"
            step="0.01"
        >

        <div class="resumenDeposito">
            <p>Depósito: <strong id="importeDeposito">$0.00</strong></p>
            <p>Comisión: <strong>$12.00</strong></p>
            <hr>
            <h3>
                Total a pagar:
                <span id="totalDeposito">$12.00</span>
            </h3>
        </div>

        <button type="button" id="confirmarCantidad">
            Confirmar depósito
        </button>

        <p id="mensajeCantidad"></p>

    </div>

</div>



</body>

</html>
